services:
  # Redis 8.10 - l'image officielle embarque RedisJSON, Search, TimeSeries et Bloom.
  # Le module JSON est une dépendance dure de ValkeyService (JSON.SET / JSON.GET).
  redis:
    image: redis:8.10
    container_name: clef-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - clef-network

  # Backend - FastAPI with Python 3.14
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: clef-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-cache:/root/.cache
      - ~/.cred/CLEF:/credentials:ro
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - ENV=dev
      # Mode mock par défaut : cette VM de développement ne détient aucune
      # credential Google sortante, et sans mocks le backend échoue au démarrage sur
      # `/credentials/clef-backend-dev-key.json` (constat H11 de docs/TODO.md).
      # Surchargeable depuis le shell : `USE_MOCKS=false docker compose up`.
      #
      # Sûr depuis la pose du garde-fou S1 : `assert_mocks_not_in_production()`
      # (app/mocks/service_factory.py) refuse l'import de l'app si `USE_MOCKS=true`
      # avec `ENVIRONMENT`/`ENV` en production. Ce fichier ne sert de toute façon
      # qu'au développement local — la production passe par Cloud Run.
      - USE_MOCKS=${USE_MOCKS:-true}
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clef-network

  # Frontend Admin - Angular 21
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: clef-frontend-admin
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - frontend-cache:/root/.npm
    environment:
      - NODE_ENV=development
      - API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    command: npm run start -- --project=admin --host 0.0.0.0 --port 4200 --poll 2000
    networks:
      - clef-network

  # Frontend Form - Angular 21
  frontend-form:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: clef-frontend-form
    ports:
      - "4202:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - frontend-form-cache:/root/.npm
    environment:
      - NODE_ENV=development
      - API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    command: npm run start -- --project=form --host 0.0.0.0 --port 4200 --poll 2000
    networks:
      - clef-network

networks:
  clef-network:
    driver: bridge

volumes:
  redis-data:
  backend-cache:
  frontend-cache:
  frontend-form-cache:


name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  GCP_REGION: europe-west1
  GCP_RESOURCE_PREFIX: clef-
  # Épinglages alignés sur backend/pyproject.toml, les Dockerfiles et la VM.
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------------------
  # Tests backend — tournent sur pull_request ET sur push (constat H1).
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      # Redis 8.10 : l'image officielle embarque RedisJSON, dépendance dure de
      # ValkeyService. Sans ce service, les 16 tests marqués `integration` sont
      # ignorés et la CI ne voit plus le chemin de données réel.
      redis:
        image: redis:8.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        env:
          USE_MOCKS: "true"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Builds de production frontend
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [admin, form]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build ${{ matrix.app }} app
        working-directory: frontend
        run: npm run build -- ${{ matrix.app }} --configuration production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-build
          path: frontend/dist/${{ matrix.app }}
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Tests unitaires frontend (Vitest via @angular/build:unit-test).
  # Nouveau job : `ng test` ne compilait pas et n'était lancé nulle part, d'où
  # une absence totale de filet unitaire côté frontend (docs/TODO.md M4, M5).
  # ---------------------------------------------------------------------------
  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [admin, form]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests for ${{ matrix.app }}
        working-directory: frontend
        run: npx ng test ${{ matrix.app }} --watch=false

  # ---------------------------------------------------------------------------
  # E2E Playwright. Le backend est mocké par e2e/helpers/mock-api.ts : ce job
  # ne démarre que les deux serveurs Angular, via le `webServer` de
  # playwright.config.ts.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test --reporter=line

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Déploiement — gardé par les quatre suites (constat H1).
  # ---------------------------------------------------------------------------
  # ─────────────────────────────────────────────────────────────────────────────
  # Le job `deploy-dev` a été RETIRÉ le 2026-08-27.
  #
  # Il n'a jamais fonctionné : chaque exécution échouait à l'authentification GCP
  # (constat H12), sans que personne le remarque. Et depuis le passage à Redis en
  # conteneur adjoint, il était devenu ACTIVEMENT dangereux — son
  # `gcloud run deploy clef-api` mono-conteneur aurait, au premier merge sur main :
  #
  #   • écrasé la topologie à deux conteneurs, donc supprimé le datastore ;
  #   • détaché le volume d'instantanés GCS, donc perdu les données ;
  #   • remis --max-instances 10, alors qu'une instance = un Redis ;
  #   • réinjecté les secrets sous leurs anciens noms non préfixés, inexistants.
  #
  # Le déploiement est manuel et volontairement hors CI : `./00-infra.sh <env>` puis
  # `./01-gcp-deploy.sh <env>`, depuis l'hôte. Voir DEPLOYMENT.md et ADR 0008.
  #
  # Son retour est prévu (constat H12, Workload Identity Federation), mais il devra
  # passer par `gcloud run services replace` et le gabarit de deploy/, pas par
  # `gcloud run deploy`. `backend/tests/test_ci_workflow.py` échoue si un job de
  # déploiement réapparaît dans ce fichier.
  # ─────────────────────────────────────────────────────────────────────────────

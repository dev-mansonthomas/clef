name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  GCP_REGION: europe-west1
  GCP_RESOURCE_PREFIX: clef-
  # Épinglages alignés sur backend/pyproject.toml, les Dockerfiles et la VM.
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------------------
  # Tests backend — tournent sur pull_request ET sur push (constat H1).
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      # Redis 8.10 : l'image officielle embarque RedisJSON, dépendance dure de
      # ValkeyService. Sans ce service, les 16 tests marqués `integration` sont
      # ignorés et la CI ne voit plus le chemin de données réel.
      redis:
        image: redis:8.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        env:
          USE_MOCKS: "true"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Builds de production frontend
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [admin, form]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build ${{ matrix.app }} app
        working-directory: frontend
        run: npm run build -- ${{ matrix.app }} --configuration production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-build
          path: frontend/dist/${{ matrix.app }}
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Tests unitaires frontend (Vitest via @angular/build:unit-test).
  # Nouveau job : `ng test` ne compilait pas et n'était lancé nulle part, d'où
  # une absence totale de filet unitaire côté frontend (docs/TODO.md M4, M5).
  # ---------------------------------------------------------------------------
  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [admin, form]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests for ${{ matrix.app }}
        working-directory: frontend
        run: npx ng test ${{ matrix.app }} --watch=false

  # ---------------------------------------------------------------------------
  # E2E Playwright. Le backend est mocké par e2e/helpers/mock-api.ts : ce job
  # ne démarre que les deux serveurs Angular, via le `webServer` de
  # playwright.config.ts.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test --reporter=line

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Déploiement — gardé par les quatre suites (constat H1).
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy to Dev (Cloud Run)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, frontend-test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_DEV }}

      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build and push backend image
        working-directory: backend
        run: |
          IMAGE_NAME="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_DEV }}/clef-images/clef-api:${{ github.sha }}"
          docker build -t $IMAGE_NAME -f Dockerfile .
          docker push $IMAGE_NAME
          echo "BACKEND_IMAGE=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Build and push frontend image
        working-directory: frontend
        run: |
          IMAGE_NAME="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_DEV }}/clef-images/clef-frontend:${{ github.sha }}"
          docker build -t $IMAGE_NAME -f Dockerfile .
          docker push $IMAGE_NAME
          echo "FRONTEND_IMAGE=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy clef-api \
            --image ${{ env.BACKEND_IMAGE }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars="ENVIRONMENT=dev,GCP_PROJECT=${{ secrets.GCP_PROJECT_DEV }},GCP_RESOURCE_PREFIX=${{ env.GCP_RESOURCE_PREFIX }}" \
            --set-secrets="GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,QR_CODE_SALT=QR_CODE_SALT:latest" \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 300 \
            --project ${{ secrets.GCP_PROJECT_DEV }}

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy clef-frontend \
            --image ${{ env.FRONTEND_IMAGE }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 80 \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --project ${{ secrets.GCP_PROJECT_DEV }}

      - name: Get service URLs
        run: |
          BACKEND_URL=$(gcloud run services describe clef-api --region ${{ env.GCP_REGION }} --format 'value(status.url)' --project ${{ secrets.GCP_PROJECT_DEV }})
          FRONTEND_URL=$(gcloud run services describe clef-frontend --region ${{ env.GCP_REGION }} --format 'value(status.url)' --project ${{ secrets.GCP_PROJECT_DEV }})
          echo "Backend URL: $BACKEND_URL"
          echo "Frontend URL: $FRONTEND_URL"
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
          echo "FRONTEND_URL=$FRONTEND_URL" >> $GITHUB_ENV
